name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production and isolated test binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist, testbin | Out-Null
          ./src/build.ps1 -Output "$pwd/dist/HDLSS5.exe"
          ./src/build.ps1 -TestHooks -Output "$pwd/testbin/HDLSS5-test.exe"
      - name: Regression tests and production command isolation
        shell: powershell
        run: |
          $testProcess = Start-Process "$pwd/testbin/HDLSS5-test.exe" -ArgumentList @('--dlss-test', "$pwd/testbin/tests") -Wait -PassThru
          if ($testProcess.ExitCode -ne 0) { throw 'Regression tests failed' }
          $production = Start-Process "$pwd/dist/HDLSS5.exe" -ArgumentList @('--scan', "$pwd/dist/forbidden.json") -Wait -PassThru
          if ($production.ExitCode -ne 2 -or (Test-Path "$pwd/dist/forbidden.json")) { throw 'Production test commands are accessible' }
      - uses: actions/upload-artifact@v4
        with:
          name: HDLSS5-Windows-x64
          path: dist/HDLSS5.exe

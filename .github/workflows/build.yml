name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          ./src/build.ps1 -Output "$pwd/dist/HDLSS.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: HDLSS-Windows-x64
          path: dist/HDLSS.exe

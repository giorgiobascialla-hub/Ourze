name: Package release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test version 1.5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable, testbin | Out-Null
          ./src/build.ps1 -Output "$pwd/portable/HDLSS5.exe"
          ./src/build.ps1 -TestHooks -Output "$pwd/testbin/HDLSS5-test.exe"
          $test = Start-Process "$pwd/testbin/HDLSS5-test.exe" -ArgumentList @('--dlss-test', "$pwd/testbin/tests") -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'Regression failure' }
          $gate = Start-Process "$pwd/portable/HDLSS5.exe" -ArgumentList @('--scan', "$pwd/testbin/forbidden.json") -Wait -PassThru
          if ($gate.ExitCode -ne 2 -or (Test-Path testbin/forbidden.json)) { throw 'Production command gate failed' }
          if ([Diagnostics.FileVersionInfo]::GetVersionInfo("$pwd/portable/HDLSS5.exe").FileVersion -ne '1.5.0.0') { throw 'Incorrect version' }
      - name: Reuse and verify previously published NR models
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download v1.4 --repo $env:GITHUB_REPOSITORY --pattern HDLSS5-Portable-1.4.zip --dir previous
          if ($LASTEXITCODE -ne 0) { throw 'Previous release download failed' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead("$pwd/previous/HDLSS5-Portable-1.4.zip")
          try {
            foreach ($series in @('rtx40','rtx50')) {
              $entry = $zip.GetEntry("nr-packages/$series/nvngx_dlssnr.dll")
              if (!$entry) { throw 'NR model missing' }
              New-Item -ItemType Directory -Force "portable/nr-packages/$series" | Out-Null
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "$pwd/portable/nr-packages/$series/nvngx_dlssnr.dll")
            }
          } finally { $zip.Dispose() }
          $expected = @{
            rtx40='cdfa6c1ec784867182164c7836f324f087b5c9f374d0c9fe46f54999feabf3ed'
            rtx50='2bc19bc09a7b89dd44f73e2ac0108fcc586e2154bdd0830f242f4f040e28789f'
          }
          foreach ($series in $expected.Keys) {
            if ((Get-FileHash "portable/nr-packages/$series/nvngx_dlssnr.dll").Hash -ne $expected[$series]) { throw 'NR hash mismatch' }
          }
      - name: Package and upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Copy-Item CHANGELOG.md portable/CHANGELOG.md
          Copy-Item docs/LEGGIMI-1.5.txt portable/LEGGIMI.txt
          $root = "$pwd/portable"
          Get-ChildItem $root -File -Recurse | ForEach-Object { (Get-FileHash $_.FullName).Hash.ToLower()+'  '+$_.FullName.Substring($root.Length+1).Replace('\','/') } | Set-Content portable/SHA256.txt
          Compress-Archive -Path portable/* -DestinationPath HDLSS5-Portable-1.5.zip
          ((Get-FileHash HDLSS5-Portable-1.5.zip).Hash.ToLower()+'  HDLSS5-Portable-1.5.zip') | Set-Content HDLSS5-Portable-1.5-SHA256.txt
          $release = gh release view v1.5 --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
          if (!$release.isDraft) { throw 'Expected a draft release; refusing to replace public assets' }
          gh release edit v1.5 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Release target update failed' }
          gh release upload v1.5 HDLSS5-Portable-1.5.zip HDLSS5-Portable-1.5-SHA256.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
